<text x="177.3" y="18.0" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10" fill="#ffffff" fill-opacity="0.6">Rigel</text>
<text x="232" y="110" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#ffffff">Lepus, the hare, under Orion's foot.</text>
<text x="232" y="130" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#ffffff">Due south at midnight in mid-December.</text>
<text x="232" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#ffffff">Stars only come out after dark. So does this.</text>
