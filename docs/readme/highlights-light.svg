<svg xmlns="http://www.w3.org/2000/svg" width="880" height="284" viewBox="0 0 880 284" role="img" aria-label="Highlights. CLOCKS: Four clock faces. Digital, flip, analog and word clock, with date and weather. SCENES: Six live ambient scenes. Rain, fireplace, aurora, night sky, ocean, lava lamp. SOUND: Sound made in code. Noise, rain, fire and surf, synthesized in real time. SLEEP: Sleep timer. 15 to 90 minutes, a 30 second fade, then a dim clock. CARE: Kind to the panel. Pixel shift every minute and night dimming. PRIVATE: No ads, no tracking. No accounts, no media files. English, Spanish, Russian.">
