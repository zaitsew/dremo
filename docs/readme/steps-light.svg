<svg xmlns="http://www.w3.org/2000/svg" width="880" height="188" viewBox="0 0 880 188" role="img" aria-label="How it works. 1. Install. Sideload the APK with adb. 2. Pick a scene. Choose a clock or scene with the D-pad. 3. Set the sound. Each scene has a default sound. 4. Set a timer. Optional sleep timer and night dimming. 5. Screensaver. Select Dremo as the TV&#x27;s screensaver.">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Inter,'Segoe UI',Helvetica,Arial,sans-serif;fill:#14161D}.m{fill:#585E6D}.cap{font-size:11px;letter-spacing:.06em}.b{font-weight:600}</style>
<rect x="0.5" y="0.5" width="879" height="187" rx="12" fill="#FFFFFF" stroke="#DCDEE5"/>
<line x1="90.0" x2="190.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="60.0" cy="52" r="20" fill="#FDE68A"/>
<text class="b" x="60.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">1</text>
<text class="b" x="40.0" y="98" font-size="15.5">Install</text>
<text class="m" x="40.0" y="120" font-size="13.5">Sideload the APK</text>
<text class="m" x="40.0" y="139" font-size="13.5">with adb.</text>
<line x1="250.0" x2="350.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="220.0" cy="52" r="20" fill="#FDE68A"/>
<text class="b" x="220.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">2</text>
<text class="b" x="200.0" y="98" font-size="15.5">Pick a scene</text>
<text class="m" x="200.0" y="120" font-size="13.5">Choose a clock or</text>
<text class="m" x="200.0" y="139" font-size="13.5">scene with the</text>
<text class="m" x="200.0" y="158" font-size="13.5">D-pad.</text>
<line x1="410.0" x2="510.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="380.0" cy="52" r="20" fill="#FDE68A"/>
<text class="b" x="380.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">3</text>
<text class="b" x="360.0" y="98" font-size="15.5">Set the sound</text>
<text class="m" x="360.0" y="120" font-size="13.5">Each scene has a</text>
<text class="m" x="360.0" y="139" font-size="13.5">default sound.</text>
<line x1="570.0" x2="670.0" y1="52" y2="52" stroke="#DCDEE5" stroke-width="2" stroke-linecap="round"/>
<circle cx="540.0" cy="52" r="20" fill="#FDE68A"/>
<text class="b" x="540.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">4</text>
<text class="b" x="520.0" y="98" font-size="15.5">Set a timer</text>
<text class="m" x="520.0" y="120" font-size="13.5">Optional sleep timer</text>
<text class="m" x="520.0" y="139" font-size="13.5">and night dimming.</text>
<circle cx="700.0" cy="52" r="20" fill="#FDE68A"/>
<text class="b" x="700.0" y="58" font-size="17" text-anchor="middle" style="fill:#14161D">5</text>
<text class="b" x="680.0" y="98" font-size="15.5">Screensaver</text>
<text class="m" x="680.0" y="120" font-size="13.5">Select Dremo as the</text>
<text class="m" x="680.0" y="139" font-size="13.5">TV&#x27;s screensaver.</text>
</svg>
